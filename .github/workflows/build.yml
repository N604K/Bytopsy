# Build and self-tests on every push and pull request; on a tag "v*" also a GitHub release with a
# zip of both programs and its SHA-256. See docs/RELEASING.md.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Visual Studio developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path src/version.h -Pattern '#define WINNCDU_VERSION_A\s+"([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.Substring(1)
            if ($tag -ne $version) { throw "Tag v$tag does not match WINNCDU_VERSION_A ($version) in src/version.h" }
          } else {
            $version = "$version-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Version: $version"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $name = "winncdu-${{ steps.version.outputs.version }}-x64"
          New-Item -ItemType Directory -Force dist, "stage/$name" | Out-Null
          Copy-Item build/winncdu.exe, build/winncdu-cli.exe, README.md "stage/$name"
          if (Test-Path LICENSE) { Copy-Item LICENSE "stage/$name" }
          Compress-Archive -Path "stage/$name/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLowerInvariant()
          # sha256sum format: "<hash>  <file>"; check with: sha256sum -c, or Get-FileHash.
          [IO.File]::WriteAllText("$PWD/dist/$name.zip.sha256", "$hash  $name.zip`n")
          Get-Content "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: winncdu-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winncdu-${{ needs.build.outputs.version }}
          path: dist

      - name: Verify checksum
        working-directory: dist
        run: sha256sum -c *.sha256

      - uses: softprops/action-gh-release@v2
        with:
          name: WinNCDU ${{ needs.build.outputs.version }}
          files: dist/*
          generate_release_notes: true
