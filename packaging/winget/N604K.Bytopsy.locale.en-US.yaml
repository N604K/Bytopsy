ShortDescription: Fast disk usage analyzer and cleaner for Windows, inspired by ncdu.
Description: |-
  Bytopsy shows what takes up space on a drive: a folder tree sorted by size, a treemap, largest
  files, file types, duplicates, developer junk, AI models, WSL and Docker disks, and games. Cleanup
  removes caches and temporary files after a review of exactly what is deleted, checks every item
  against protected locations, and keeps a journal with Restore from the Recycle Bin.
  Two programs: bytopsy (windowed) and bytopsy-cli (ncdu-style terminal app).
