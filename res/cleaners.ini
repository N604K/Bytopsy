# WinNCDU cleanup categories.
#
# This file is built into winncdu.exe. To add, change or turn off a category on your PC, put a section
# with the same format in %LOCALAPPDATA%\WinNCDU\cleaners.ini (menu ... -> Cleanup rules). A section there
# with the same [id] replaces the built-in one; "enabled = false" removes it.
#
#   [id]           unique, lowercase
#   name = ...     shown on the card
#   desc = ...     one sentence: what it is and what happens after deleting it
#   icon = E7C3    Segoe Fluent Icons glyph (hex), optional
#   admin = true   needs administrator rights
#   safe = true    selected by default (only for things that are always re-created or downloaded again)
#   kind = files | recyclebin | external | command
#                  (default: files; external = Windows Disk Cleanup; command = see below)
#   path = <folder> [| files=<pattern>] [| age=<24h|7d>]
#                  repeatable; %ENV% variables and '*' folder segments work. Without "files=" every
#                  file and folder inside <folder> is deleted (never <folder> itself); with it, only the
#                  matching files ("*.conda;*.tar.bz2" for several). "age" skips anything changed more
#                  recently.
#   command = ...  with kind = command: the tool's own clean command, run without a window instead
#                  of deleting files (for caches with a database that deleting would corrupt). The
#                  paths are only measured. The program must be on PATH.
#
# Safety: whatever a rule says, items that the protection rules mark Important or Blocked (see
# "Protected locations") are never listed or deleted, and every item can be reviewed and unchecked
# before cleaning. Prefer folders that apps re-create on their own; describe honestly what is lost.

[recycle]
name = Recycle Bin
desc = Files you deleted earlier still use space until the bin is emptied.
icon = E74D
safe = true
kind = recyclebin

[temp]
name = Temporary files
desc = Leftovers from apps and installers (older than 1 day).
icon = E7C3
safe = true
path = %TEMP% | age=24h

[wintemp]
name = Windows temporary files
desc = System temp folder (older than 1 day).
icon = E7C3
admin = true
safe = true
path = %SystemRoot%\Temp | age=24h

[browser]
name = Browser caches
desc = Chrome, Edge, Brave, Vivaldi, Opera and Firefox caches. Close the browsers first for best results.
icon = E774
safe = true
path = %LOCALAPPDATA%\Google\Chrome\User Data\*\Cache
path = %LOCALAPPDATA%\Google\Chrome\User Data\*\Code Cache
path = %LOCALAPPDATA%\Google\Chrome\User Data\*\GPUCache
path = %LOCALAPPDATA%\Microsoft\Edge\User Data\*\Cache
path = %LOCALAPPDATA%\Microsoft\Edge\User Data\*\Code Cache
path = %LOCALAPPDATA%\Microsoft\Edge\User Data\*\GPUCache
path = %LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\Cache
path = %LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\Code Cache
path = %LOCALAPPDATA%\Vivaldi\User Data\*\Cache
path = %LOCALAPPDATA%\Opera Software\Opera Stable\Cache
path = %LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\cache2

[thumbs]
name = Thumbnail cache
desc = Explorer rebuilds thumbnails automatically when needed.
icon = E91B
safe = true
path = %LOCALAPPDATA%\Microsoft\Windows\Explorer | files=thumbcache_*.db
path = %LOCALAPPDATA%\Microsoft\Windows\Explorer | files=iconcache_*.db

[crash]
name = Crash dumps & error reports
desc = Memory dumps and Windows Error Reporting archives.
icon = E7BA
safe = true
path = %LOCALAPPDATA%\CrashDumps
path = %LOCALAPPDATA%\Microsoft\Windows\WER\ReportArchive
path = %LOCALAPPDATA%\Microsoft\Windows\WER\ReportQueue
path = %ProgramData%\Microsoft\Windows\WER\ReportArchive
path = %ProgramData%\Microsoft\Windows\WER\ReportQueue
path = %SystemRoot%\Minidump
path = %SystemRoot%\LiveKernelReports
path = %SystemRoot% | files=MEMORY.DMP

[wu]
name = Windows Update downloads
desc = Update packages that were already installed.
icon = E895
admin = true
safe = true
path = %SystemRoot%\SoftwareDistribution\Download | age=24h

[do]
name = Delivery Optimization cache
desc = Update pieces shared with other PCs.
icon = E895
admin = true
safe = true
path = %SystemRoot%\ServiceProfiles\NetworkService\AppData\Local\Microsoft\Windows\DeliveryOptimization\Cache

[shader]
name = Graphics shader caches
desc = DirectX / NVIDIA / AMD shader caches; games rebuild them.
icon = E7F4
safe = true
path = %LOCALAPPDATA%\D3DSCache
path = %LOCALAPPDATA%\NVIDIA\DXCache
path = %LOCALAPPDATA%\NVIDIA\GLCache
path = %LOCALAPPDATA%\AMD\DxCache
path = %LOCALAPPDATA%\AMD\DxcCache

[dev]
name = Developer package caches
desc = Downloads of npm, Yarn, pnpm, Bun, Deno, pip, uv, Poetry, NuGet, Go, Cargo, Composer and vcpkg; fetched again when needed.
icon = E943
path = %LOCALAPPDATA%\npm-cache
path = %APPDATA%\npm-cache
path = %LOCALAPPDATA%\Yarn\Cache
path = %LOCALAPPDATA%\pnpm\store
path = %USERPROFILE%\.bun\install\cache
# Deno: only the download and compile caches; location_data holds apps' localStorage.
path = %LOCALAPPDATA%\deno\deps
path = %LOCALAPPDATA%\deno\gen
path = %LOCALAPPDATA%\deno\npm
path = %LOCALAPPDATA%\deno\remote
path = %LOCALAPPDATA%\deno\registries
path = %LOCALAPPDATA%\pip\Cache
path = %LOCALAPPDATA%\uv\cache
# Poetry keeps virtual environments in Cache\virtualenvs: only its downloads go.
path = %LOCALAPPDATA%\pypoetry\Cache\cache
path = %LOCALAPPDATA%\pypoetry\Cache\artifacts
path = %USERPROFILE%\.nuget\packages
path = %LOCALAPPDATA%\go-build
path = %USERPROFILE%\.cargo\registry\cache
# Composer's cache (the global packages and auth.json live in %APPDATA%\Composer, untouched).
path = %LOCALAPPDATA%\Composer\files
path = %LOCALAPPDATA%\Composer\repo
path = %LOCALAPPDATA%\Composer\vcs
path = %LOCALAPPDATA%\vcpkg\archives

[jvm]
name = Java build caches
desc = Maven and Gradle downloads. Artifacts you installed yourself with "mvn install" come back only by building those projects again.
icon = E943
path = %USERPROFILE%\.m2\repository
path = %USERPROFILE%\.gradle\caches

[conda]
name = Conda package downloads
desc = Package archives and index caches of conda, Miniconda, Anaconda and Miniforge. Installed environments are not touched.
icon = E943
# Only the archives: the extracted packages in pkgs are hard-linked into environments.
path = %USERPROFILE%\*conda3\pkgs | files=*.conda;*.tar.bz2
path = %USERPROFILE%\*conda3\pkgs\cache
path = %USERPROFILE%\miniforge3\pkgs | files=*.conda;*.tar.bz2
path = %USERPROFILE%\miniforge3\pkgs\cache
path = %USERPROFILE%\mambaforge\pkgs | files=*.conda;*.tar.bz2
path = %USERPROFILE%\mambaforge\pkgs\cache
path = %USERPROFILE%\.conda\pkgs | files=*.conda;*.tar.bz2
path = %USERPROFILE%\.conda\pkgs\cache
path = %ProgramData%\*conda3\pkgs | files=*.conda;*.tar.bz2
path = %ProgramData%\*conda3\pkgs\cache

[conan]
name = Conan package cache
desc = Built and downloaded C/C++ packages. Cleaned with Conan's own command, so its cache database stays consistent.
icon = E943
kind = command
command = conan remove "*" -c
path = %USERPROFILE%\.conan2\p

[winold]
name = Previous Windows installation
desc = Windows.old from an upgrade. Removed with Windows Disk Cleanup.
icon = E7F8
admin = true
kind = external
path = %SystemDrive%\Windows.old
